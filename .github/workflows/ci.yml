# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI never needs game data, console access or private configuration.
# It uploads only the compiled probe payload, never logs.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 'bash' here means bash -eo pipefail, so '| tee' cannot hide a failure.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publication check (HEAD tree)
        run: python3 tools/publication_check.py --tracked
      - name: Publication check (all history, including author e-mails)
        run: python3 tools/publication_check.py --all-history
      - name: Shell script lint
        run: shellcheck -x tools/*.sh tools/lib/common.sh experiments/01-runtime-probe/link-inventory.sh experiments/02a-sdl-display/tools/fetch-font.sh ports/cpython/build.sh

  host-probe:
    # Logic test of the probe on ordinary hosts. Not evidence about the PS5.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run probe on host
        run: |
          make -C experiments/01-runtime-probe run-host | tee "$RUNNER_TEMP/probe.txt"
          grep -q '^KSRE_PS5_PROBE_END .* fail=0 ' "$RUNNER_TEMP/probe.txt"

  host-sdl-display:
    # Headless logic test of experiment 02a (SDL dummy video driver) with the
    # system SDL2. Not evidence about the PS5; SDL2 here never reaches a PS5 build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL2, SDL2_image, SDL2_ttf
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
          else
            brew install sdl2 sdl2_image sdl2_ttf
          fi
      - name: Cache the pinned font download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: external/toolchains/downloads
          key: dejavu-${{ hashFiles('upstreams.lock') }}
      - name: Build and run 02a on host (dummy video driver)
        run: |
          make -C experiments/02a-sdl-display run-host | tee "$RUNNER_TEMP/02a.txt"
          grep -q '^KSRE_PS5_02A_END .* fail=0$' "$RUNNER_TEMP/02a.txt"

  host-gl-shaders:
    # Experiment 02b on ordinary hosts: build with the system SDL2 on both OSes.
    # On Linux the shaders are also executed for real on Mesa's llvmpipe through
    # SDL's offscreen video driver + EGL (desktop GL dialect), and the read-back
    # probes must pass. That is a host result, not evidence about the PS5.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL2 (and a software GL stack on Linux)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q libsdl2-dev libegl1 libgl1 libgl1-mesa-dri libgles2 libegl-mesa0
          else
            brew install sdl2
          fi
      - name: Build 02b on host
        run: make -C experiments/02b-gl-shaders host
      - name: Run the 02b read-back self-test on llvmpipe (Linux, offscreen + EGL)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          build/experiments/02b-gl-shaders/host/ksre-ps5-02b-gl-shaders --api gl --windowed --selftest-only --hold-ms 0 | tee "$RUNNER_TEMP/02b.txt"
          grep -q '^02B PASS selftest ' "$RUNNER_TEMP/02b.txt"
          grep -q '^KSRE_PS5_02B_END fail=0$' "$RUNNER_TEMP/02b.txt"

  ps5-cross-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host LLVM 18 (the version the SDK's own CI uses)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 lld-18 llvm-18 zlib1g-dev
      - name: Cache the pinned SDK download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: external/toolchains/downloads
          key: ps5-payload-sdk-${{ hashFiles('upstreams.lock') }}
      - name: Fetch pinned ps5-payload-sdk (SHA-256 verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tools/fetch-sdk.sh | tee "$RUNNER_TEMP/sdk.txt"
          grep '^export PS5_PAYLOAD_SDK=' "$RUNNER_TEMP/sdk.txt" | sed 's/^export //; s/"//g' >> "$GITHUB_ENV"
      - name: Fetch pinned pacbrew bundle v0.41.1 (SHA-256 verified)
        run: tools/fetch-pacbrew.sh hwgl | tee "$RUNNER_TEMP/pacbrew.txt"
      - name: Environment check (milestone 1)
        run: tools/check-env.sh --milestone 1
      - name: Cross-compile and link the probe payload
        run: |
          make -C experiments/01-runtime-probe ps5
          elf=build/experiments/01-runtime-probe/ps5/ksre-ps5-probe.elf
          file "$elf"
          readelf -h "$elf" | grep -E 'Class|Machine|Type'
          readelf -d "$elf" | grep NEEDED || true
          sha256sum "$elf"
      - name: Link inventory for CPython configure
        run: make -C experiments/01-runtime-probe link-inventory
      - name: Cross-build and link experiment 02a (SDL2 display) with the pacbrew bundle
        run: |
          make -C experiments/02a-sdl-display ps5
          elf=build/experiments/02a-sdl-display/ps5/ksre-ps5-02a-sdl-display.elf
          file "$elf"
          readelf -h "$elf" | grep -E 'Class|Machine|Type'
          readelf -d "$elf" | grep NEEDED || true
          sha256sum "$elf"
      - name: Fetch pinned pacbrew bundle v0.40.3 (software GL; SHA-256 verified)
        run: tools/fetch-pacbrew.sh swgl | tee "$RUNNER_TEMP/pacbrew-swgl.txt"
      - name: Cross-build and link experiment 02b (GL shaders) with both pacbrew bundles
        run: |
          make -C experiments/02b-gl-shaders ps5
          make -C experiments/02b-gl-shaders ps5 PACBREW=swgl
          for elf in build/experiments/02b-gl-shaders/ps5/ksre-ps5-02b-gl-shaders.elf build/experiments/02b-gl-shaders/ps5-swgl/ksre-ps5-02b-gl-shaders.elf; do
            file "$elf"
            readelf -d "$elf" | grep NEEDED || true
            sha256sum "$elf"
          done
      - name: Cache the host build Python (CPython 3.12.8, used only on the build machine)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/host-python
          key: host-python-${{ runner.os }}-${{ hashFiles('upstreams.lock', 'ports/cpython/build.sh') }}
      - name: Cross-build CPython 3.12.8 (static) for the PS5
        run: |
          ports/cpython/build.sh host
          ports/cpython/build.sh ps5
          tr '\n' ' ' < build/cpython/ps5/modules.txt; echo
          ls -l build/cpython/ps5/lib build/cpython/ps5/python-home/lib
      - name: Link experiment 03 (payload embedding Python) and run its host twin
        run: |
          make -C experiments/03-python-hello ps5
          elf=build/experiments/03-python-hello/ps5/ksre-ps5-03-python-hello.elf
          file "$elf"
          readelf -d "$elf" | grep NEEDED || true
          sha256sum "$elf"
          make -C experiments/03-python-hello run-host | tee "$RUNNER_TEMP/03.txt"
          grep -q '^03 SUMMARY pass=10 fail=0 ' "$RUNNER_TEMP/03.txt"
          grep -q '^KSRE_PS5_03_END rc=0$' "$RUNNER_TEMP/03.txt"
      - name: Upload 02b payloads (compiled output only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksre-ps5-02b-gl-shaders-elf
          path: |
            build/experiments/02b-gl-shaders/ps5/ksre-ps5-02b-gl-shaders.elf
            build/experiments/02b-gl-shaders/ps5-swgl/ksre-ps5-02b-gl-shaders.elf
          retention-days: 14
          if-no-files-found: error
      - name: Upload 02a payload (compiled output only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksre-ps5-02a-sdl-display-elf
          path: build/experiments/02a-sdl-display/ps5/ksre-ps5-02a-sdl-display.elf
          retention-days: 14
          if-no-files-found: error
      - name: Upload probe payload (compiled output only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksre-ps5-probe-elf
          path: build/experiments/01-runtime-probe/ps5/ksre-ps5-probe.elf
          retention-days: 14
          if-no-files-found: error
